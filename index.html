<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#17261f;--mute:#5d6e65;--g1:#24503c;--g2:#3f7d62;--mint:#dcebe2;--gold:#f0b429;--line:#dfe6e1;--err:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--card:#17221d;--ink:#eaf2ed;--mute:#9bb0a5;--mint:#1f3329;--line:#2a3a32}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;font-size:26px}
header h1{font-size:20px;margin:0;line-height:1.1}header small{color:var(--mute)}
.me{margin-left:auto;border:0;background:var(--mint);color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
.hero{background:linear-gradient(150deg,var(--g1),var(--g2));color:#fff;border-radius:28px;padding:28px 24px}
.hero h2{font-size:32px;line-height:1.1;margin:0 0 12px;letter-spacing:-.5px}
.hero p{margin:0 0 20px;opacity:.92}
button,.btn{font:inherit;cursor:pointer}
.btn{border:0;border-radius:16px;padding:14px 20px;font-weight:700;background:#fff;color:var(--g1);min-height:48px}
.btn.solid{background:var(--g1);color:#fff}
.btn.gold{background:var(--gold);color:#2b2100}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:left;color:var(--ink)}
.tile b{display:block;font-size:18px;margin:6px 0 4px;line-height:1.2}.tile span{color:var(--mute);font-size:14px}
.tile i{font-style:normal;font-size:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:18px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;padding:6px 0}
.steps li:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-weight:700;font-size:14px}
.note{text-align:center;color:var(--mute);font-size:13px;margin:16px 0}
h2.t{font-size:24px;margin:8px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:40px}
.chip[aria-pressed=true]{background:var(--g1);color:#fff;border-color:var(--g1)}
.item{display:flex;gap:14px}
.av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-size:22px}
.item h3{margin:0;font-size:17px}.meta{color:var(--mute);font-size:14px}
.price{font-weight:700;color:var(--g1)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .price{color:var(--gold)}}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.err{color:var(--err);font-size:14px;min-height:20px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}
.tab{flex:1;max-width:120px;border:0;background:none;color:var(--mute);padding:6px;border-radius:14px;font-size:12px;min-height:52px}
.tab span{display:block;font-size:22px}.tab[aria-current=page]{color:var(--g1);background:var(--mint);font-weight:700}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:9;max-width:90%}
.empty{text-align:center;color:var(--mute);padding:24px}
#splash{position:fixed;inset:0;z-index:20;background:linear-gradient(150deg,var(--g1),var(--g2));display:grid;place-content:center;justify-items:center;gap:14px;color:#fff;transition:opacity .4s;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(260px,72vw);height:auto;overflow:visible;filter:drop-shadow(0 8px 14px rgba(0,0,0,.28))}
#splash b{font-size:28px;letter-spacing:-.5px}
#splash small{opacity:.85}
@media (prefers-reduced-motion:no-preference){#splash .hl{animation:inL .7s cubic-bezier(.2,.8,.2,1) .1s both}#splash .hr{animation:inR .7s cubic-bezier(.2,.8,.2,1) .1s both}#splash .hands{transform-box:fill-box;transform-origin:center;animation:clasp .5s ease-in-out .85s 1}#splash .heart{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,1.6,.4,1) 1.1s both,beat .9s ease-in-out 1.75s 2}#splash .ring{transform-box:fill-box;transform-origin:center;animation:ring .9s ease-out 1.1s both}#splash b,#splash small{animation:fade .6s 1.4s both}@keyframes inL{from{transform:translateX(-90px);opacity:0}}@keyframes inR{from{transform:translateX(90px);opacity:0}}@keyframes clasp{30%{transform:translateY(-4px) rotate(-2deg)}60%{transform:translateY(3px) rotate(2deg)}}@keyframes pop{from{transform:scale(0);opacity:0}}@keyframes beat{50%{transform:scale(1.18)}}@keyframes ring{from{transform:scale(.3);opacity:.7}to{transform:scale(2.4);opacity:0}}@keyframes fade{from{opacity:0;transform:translateY(8px)}}}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .25s ease}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
:root{--bg:#f5f7f4;--g1:#12392a;--g2:#2c7653;--gold:#f3b63f;--sh:0 1px 2px rgba(18,57,42,.06),0 10px 28px -10px rgba(18,57,42,.14);--r:20px}
body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em}
.app{padding:0 16px 112px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 -16px 16px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:12px;font-size:22px;box-shadow:0 6px 14px -4px rgba(18,57,42,.45)}
header h1{font-size:18px;font-weight:800;letter-spacing:-.02em}header small{font-size:12.5px}
.me{width:40px;height:40px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--g1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .me{color:var(--gold)}}
.hero{position:relative;overflow:hidden;padding:32px 24px 28px;background:radial-gradient(120% 90% at 100% 0%,rgba(243,182,63,.28),transparent 55%),linear-gradient(155deg,var(--g1),var(--g2));box-shadow:0 20px 40px -18px rgba(18,57,42,.6)}
.hero h2{font-size:34px;font-weight:800;line-height:1.08;letter-spacing:-.03em}
.hero p{max-width:30ch}
.btn{border-radius:14px;transition:transform .12s}.btn:active{transform:scale(.97)}
.hero .btn{background:var(--gold);color:#2b2100;box-shadow:0 10px 22px -8px rgba(0,0,0,.4)}
.hero .btn:focus-visible{outline-color:#fff}
.btn.solid{background:var(--g1);box-shadow:0 10px 20px -10px rgba(18,57,42,.7)}
.tile,.card{border-radius:var(--r);box-shadow:var(--sh)}
.tile{display:flex;flex-direction:column;padding:16px}
.tile i{width:44px;height:44px;border-radius:14px;background:var(--mint);color:var(--g1);display:grid;place-items:center;margin-bottom:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile i{color:var(--gold)}}
.tile b{font-size:16px;font-weight:800;margin:0 0 4px}
.card h3{font-weight:800}
.steps li{padding:8px 0}.steps li:before{background:var(--g1);color:#fff}
h2.t{font-size:26px;font-weight:800;letter-spacing:-.03em}
.chip{font-weight:600;font-size:14px;padding:8px 14px}
.item h3{font-weight:700}.av{border-radius:16px}
.price{background:var(--mint);padding:5px 12px;border-radius:999px;font-size:14px}
label{font-size:14px;margin:16px 0 6px}
input,select,textarea{min-height:48px;border-radius:14px}
input:focus,select:focus,textarea:focus{border-color:var(--g2);outline:3px solid color-mix(in srgb,var(--g2) 30%,transparent);outline-offset:0}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;border:1px solid var(--line);border-radius:22px;padding:6px;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 14px 32px -10px rgba(18,57,42,.35)}
.tab{max-width:none;font-weight:600;border-radius:16px}
.tab span{display:flex;justify-content:center;margin-bottom:2px;font-size:0}
.tab[aria-current=page]{background:var(--g1);color:#fff}
.toast{bottom:108px;border-radius:14px;box-shadow:var(--sh)}
.me{overflow:hidden;padding:0}.me img,.av img{width:100%;height:100%;object-fit:cover;display:block}.av{overflow:hidden}
.ph{width:136px;height:136px;margin:8px auto 16px;border-radius:50%;background:var(--mint);color:var(--g1);display:grid;place-items:center;font-size:48px;font-weight:800;overflow:hidden;border:4px solid var(--card);box-shadow:var(--sh)}
.ph img{width:100%;height:100%;object-fit:cover}
body.gate nav,body.gate .me{display:none}
.row2{display:flex;flex-wrap:wrap;gap:8px}
.sr{position:absolute;left:-9999px}
.chat{display:flex;flex-direction:column}
.ms{display:flex;flex-direction:column;gap:8px;overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:52vh;min-height:30vh;padding:8px 2px}
.bub{flex:none;width:fit-content;max-width:82%;padding:10px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow-wrap:break-word;word-break:break-word;white-space:pre-wrap}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.bub.mine{align-self:flex-end;background:var(--g1);color:#fff;border-color:var(--g1)}
.bub.them{align-self:flex-start}
.rate{font-weight:600}.gold{color:var(--gold)}
.revs{margin:8px 0;font-size:14px}.revs summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}.rv{padding:8px 0;border-top:1px solid var(--line)}
.stars{display:flex;gap:4px;justify-content:center;margin:6px 0}
.star{background:none;border:0;font-size:34px;line-height:1;color:var(--line);padding:4px;min-width:44px;min-height:44px;cursor:pointer}
.star.on{color:var(--gold)}
.star:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:12px}
.mf{display:flex;gap:8px;margin-top:8px}.mf input{flex:1;min-width:0}
.tab{position:relative}.tab .bd{position:absolute;top:6px;left:calc(50% + 8px);width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--card)}
.sec{font-size:17px;font-weight:800;margin:22px 0 10px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font-size:12px;font-weight:600;min-height:76px;box-shadow:var(--sh)}
.cat span{font-size:24px}
.rc{align-items:center;display:flex}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--g1);min-height:32px}.rc>div:nth-child(2){flex:1}
.cat:focus-visible,.rc:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.set:first-of-type{border-top:0}
.set b{display:block;font-size:15px}.set small{color:var(--mute);font-size:13px}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:52px;min-height:0;height:30px;padding:0;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}

<script>
const CATS=["Bricolage","Jardinage","Ménage","Courses","Informatique","Garde d'animaux","Cours"];
const EMO={"Bricolage":"🔧","Jardinage":"🌿","Ménage":"🧽","Courses":"🛒","Informatique":"💻","Garde d'animaux":"🐕","Cours":"📚"};
let state={user:null,filter:"Tous",view:"home",

{id:2,cat:"Jardinage",title:"Taille de haie et tonte",who:"Mehdi",area:"Quartier des Lilas",price:"50 € le forfait",desc:"Tonte, taille de haie et évacuation des déchets : tout le jardin pour un prix fixe."},
{id:3,cat:"Informatique",title:"Aide sur ordinateur et téléphone",who:"Sophie",area:"Centre-ville",price:"10 €/h",desc:"Je vous aide à installer, trier vos photos ou sécuriser vos comptes."},
{id:4,cat:"Garde d'animaux",title:"Promenade de chiens",who:"Lucas",area:"Parc Nord",price:"8 € la sortie",desc:"Disponible en fin de journée et le week-end."},
{id:5,cat:"Courses",title:"Courses pour personnes âgées",who:"Nadia",area:"Les Lilas",price:"Gratuit",desc:"Je fais vos courses le samedi matin, sans frais."},
{id:6,cat:"Cours",title:"Soutien en maths (collège)",who:"Antoine",area:"Gare",price:"18 €/h",desc:"Étudiant en master, méthode simple et rassurante."},
{id:7,cat:"Bricolage",title:"Peinture et petits travaux",who:"Karim",area:"Centre",price:"15 €/h",desc:"Peinture, joints, fixations : je viens avec mon matériel."},
{id:8,cat:"Ménage",title:"Ménage à domicile",who:"Julie",area:"Centre",price:"14 €/h",desc:"Appartement ou maison, produits écologiques fournis."},
{id:9,cat:"Jardinage",title:"Entretien de jardin",who:"Hugo",area:"Centre",price:"60 € le forfait",desc:"Tonte, désherbage et taille des arbustes pour un prix fixe."}],
sent:[],accounts:[],authMode:"login",radius:25,q:""};
try{const s=JSON.parse(localStorage.getItem("cdm")||"null");if(s&&s.user)state.user=s.user;if(s&&s.mine)state.ads=state.ads.concat(s.mine.map(a=>Object.assign({},a,{owner:a.owner||(s.user&&s.user.email)||""})));if(s&&s.accounts)state.accounts=s.accounts}catch(e){}
const SHOW_DEMO=false;
const SEED=SHOW_DEMO?state.ads.filter(a=>a.id<100):[];
if(!SHOW_DEMO)state.ads=state.ads.filter(a=>a.id>=100);
const vis=c=>SHOW_DEMO||c.remote;
window.cdmMerge=function(remote){
  const seen0=window.cdmSeenAds,fresh=seen0?remote.filter(r=>!seen0.has(r.id)):[];window.cdmSeenAds=new Set([...(seen0||[]),...remote.map(r=>r.id)]);
  const em=(state.user&&state.user.email||"").toLowerCase(),map=new Map();
  SEED.forEach(a=>map.set(a.id,a));
  const mig=state.ads.filter(a=>a.id>=100&&a.mine&&a.owner&&!a.sync&&!remote.some(r=>r.id===a.id));mig.forEach(a=>{map.set(a.id,a);if(window.cdmAds&&!a.sync){a.sync=1;window.cdmAds.publish(a).catch(()=>{a.sync=0})}});
  remote.forEach(r=>{r.sync=1;r.mine=!!em&&String(r.owner||"").toLowerCase()===em;map.set(r.id,r)});
  state.ads=[...map.values()].sort((x,y)=>y.id-x.id);
  const u0=state.user;if(u0&&u0.adAlerts!==false&&fresh.length){const near=fresh.filter(r=>!r.mine&&Date.now()-(r.created||0)<600000&&km(r)<=state.radius);if(near.length){const msg="Nouvelle annonce près de vous : "+near[0].title+(near.length>1?" (+"+(near.length-1)+")":"");toast(msg);try{if("Notification" in window&&Notification.permission==="granted"&&document.hidden)new Notification("CoupDeMain",{body:msg})}catch(x){}}}
  if(["find","home","profile"].includes(state.view)&&state.user)render();
};
function loadRemote(){if(window.cdmAds)window.cdmAds.subscribe(window.cdmMerge);if(window.cdmReviews)window.cdmReviews.subscribe(window.cdmRevMerge)}
const CITIES={"Paris":[48.8566,2.3522],"Versailles":[48.8049,2.1204],"Saint-Denis":[48.9362,2.3574],"Melun":[48.5408,2.6603],"Orléans":[47.9029,1.9093],"Lyon":[45.764,4.8357],"Villeurbanne":[45.7719,4.8902],"Marseille":[43.2965,5.3698],"Toulouse":[43.6047,1.4442],"Nice":[43.7102,7.262],"Nantes":[47.2184,-1.5536],"Bordeaux":[44.8378,-0.5792],"Lille":[50.6292,3.0573],"Strasbourg":[48.5734,7.7521],"Rennes":[48.1173,-1.6778],"Montpellier":[43.6108,3.8767],"Grenoble":[45.1885,5.7245]};
const DEP={75:"Paris",69:"Lyon",13:"Marseille",31:"Toulouse",6:"Nice",44:"Nantes",33:"Bordeaux",59:"Lille",67:"Strasbourg",35:"Rennes",34:"Montpellier",38:"Grenoble"};
const XK="cdm_xc";try{Object.assign(CITIES,JSON.parse(localStorage.getItem(XK)||"{}"))}catch(e){}
function addCity(nom,lat,lon,dep){let key=nom;const ex=CITIES[nom];if(ex&&Math.abs(ex[0]-lat)+Math.abs(ex[1]-lon)>0.15)key=nom+" ("+dep+")";
  CITIES[key]=[+(+lat).toFixed(4),+(+lon).toFixed(4)];try{const x=JSON.parse(localStorage.getItem(XK)||"{}");x[key]=CITIES[key];const ks=Object.keys(x);if(ks.length>120)delete x[ks[0]];localStorage.setItem(XK,JSON.stringify(x))}catch(e){}return key}
async function geoSearch(q){try{const dig=/^\d{5}$/.test(q);const r=await fetch("https://geo.api.gouv.fr/communes?"+(dig?"codePostal="+q:"nom="+encodeURIComponent(q)+"&boost=population")+"&fields=nom,centre,departement&limit=6");if(!r.ok)return[];const j=await r.json();
  return j.filter(c=>c.centre&&c.centre.coordinates).map(c=>({nom:c.nom,lat:c.centre.coordinates[1],lon:c.centre.coordinates[0],dep:c.departement?c.departement.code:""}))}catch(e){return[]}}
async function resolveCity(vl,cp){const n=norm(vl),k=Object.keys(CITIES).find(c=>norm(c)===n);if(k)return k;const r=await geoSearch(vl);if(!r.length)return"";
  const d=String(cp||"").slice(0,2),pick=r.find(c=>norm(c.nom)===n&&String(c.dep).slice(0,2)===d)||r.find(c=>norm(c.nom)===n)||r[0];return addCity(pick.nom,pick.lat,pick.lon,pick.dep)}
function attachSuggest(inp,pick){if(!inp)return;const box=document.createElement("div");box.className="sug";box.hidden=true;(inp.closest(".row2")||inp).insertAdjacentElement("afterend",box);
  inp.removeAttribute("list");inp.setAttribute("autocomplete","off");inp.setAttribute("autocapitalize","words");let t=0,seq=0,items=[];
  const show=a=>{items=a;box.innerHTML=a.map((c,i)=>`<button type="button" class="sugi" data-i="${i}"><b>${esc(c.nom)}</b><span>${esc(c.dep||"")}</span></button>`).join("");box.hidden=!a.length};
  const run=async()=>{const q=inp.value.trim();if(q.length<2){show([]);return}const me=++seq;
    const loc=Object.keys(CITIES).filter(c=>norm(c).startsWith(norm(q))).slice(0,3).map(c=>({nom:c,lat:CITIES[c][0],lon:CITIES[c][1],dep:"",known:1}));show(loc);
    const r=await geoSearch(q);if(me!==seq)return;show(r.concat(loc.filter(l=>!r.some(x=>norm(x.nom)===norm(l.nom)))).slice(0,6))};
  inp.addEventListener("input",()=>{clearTimeout(t);t=setTimeout(run,220)});
  const choose=e=>{const b=e.target.closest&&e.target.closest(".sugi");if(!b||!items[+b.dataset.i])return;e.preventDefault();const c=items[+b.dataset.i];const k=c.known?c.nom:addCity(c.nom,c.lat,c.lon,c.dep);inp.value=k;show([]);if(pick)pick(k)};
  box.addEventListener("pointerdown",choose);box.addEventListener("click",choose)}
let homeTried="";
function ensureHome(){const u=state.user;if(!u)return;const c=ucity(u);if(!c||homeTried===c||Object.keys(CITIES).some(x=>norm(x)===norm(c)))return;homeTried=c;
  resolveCity(c,u.cp).then(k=>{if(k&&["home","find","profile"].includes(state.view))render()})}
const AC={1:"Paris",2:"Versailles",3:"Saint-Denis",4:"Melun",5:"Lyon",6:"Orléans",7:"Lyon",8:"Marseille",9:"Villeurbanne"};
const ucity=u=>(u&&(u.city||DEP[+String(u.cp||"").slice(0,2)]))||"";
const homeCity=()=>{const c=ucity(state.user);return Object.keys(CITIES).find(x=>norm(x)===norm(c))||DEP[+String(state.user&&state.user.cp||"").slice(0,2)]||"Paris"};
const baseCity=()=>{const u=state.user;return u&&u.geo&&u.geoCity&&CITIES[u.geoCity]?u.geoCity:homeCity()};
const center=()=>state.center||baseCity();
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/-/g," ").toLowerCase().trim();
const dist=(p,q)=>{const r=Math.PI/180,dl=(q[0]-p[0])*r,dn=(q[1]-p[1])*r,x=Math.sin(dl/2)**2+Math.cos(p[0]*r)*Math.cos(q[0]*r)*Math.sin(dn/2)**2;return Math.round(12742*Math.asin(Math.sqrt(x)))};
const locOf=a=>a.loc&&CITIES[a.loc]?a.loc:(a.mine?homeCity():AC[a.id]||"Paris");
const cityOf=a=>a.city||(a.mine?(ucity(state.user)||homeCity()):AC[a.id]||"Paris");
const adPt=a=>a.lat!=null&&a.lon!=null?[+a.lat,+a.lon]:CITIES[locOf(a)];
const kmFrom=(a,c)=>{const u=state.user,p=(u&&u.geo&&u.geoPos&&c===baseCity())?u.geoPos:CITIES[c];return dist(adPt(a),p)};
function setGeo(pos){const u=state.user;if(!u)return false;const p=[+pos.coords.latitude.toFixed(4),+pos.coords.longitude.toFixed(4)];let best="",bd=1e9;
  Object.keys(CITIES).forEach(c=>{const d=dist(p,CITIES[c]);if(d<bd){bd=d;best=c}});
  const moved=!u.geoPos||dist(p,u.geoPos)>=1;u.geo=true;u.geoPos=p;u.geoCity=best;
  if(moved){u.geoName=best;save();revGeo(p)}return moved}
function revGeo(p){try{fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&accept-language=fr&lat="+p[0]+"&lon="+p[1]).then(r=>r.json()).then(j=>{const a=j.address||{},n=a.city||a.town||a.village||a.municipality||a.county;if(n&&state.user&&state.user.geo){state.user.geoName=n;save();if(state.view==="profile")profile()}}).catch(()=>{})}catch(e){}}
function refreshGeo(){const u=state.user;if(!u||!u.geo||!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(pos=>{if(setGeo(pos)&&["home","find"].includes(state.view))render()},()=>{},{enableHighAccuracy:true,timeout:15000,maximumAge:60000})}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshGeo()});
const km=a=>kmFrom(a,center());
const RT={1:[4.8,23],2:[4.6,15],3:[5,8],4:[4.7,31],5:[4.9,42],6:[4.5,12],7:[4.4,9],8:[4.8,20],9:[4.7,6]};
const myRate=id=>{const c=((state.user&&state.user.convs)||[]).find(x=>x.id===id||(x.remote&&x.adId===id));return c&&c.rating?c.rating:null};
const REV={};
window.cdmRevMerge=l=>{Object.keys(REV).forEach(k=>delete REV[k]);l.forEach(r=>{r.stars=Math.max(1,Math.min(5,r.stars|0));(REV[r.adId]=REV[r.adId]||[]).push(r)});if(state.user&&["find","home"].includes(state.view)&&!document.querySelector("details[open],textarea:focus,input:focus"))render()};
const meEm=()=>((state.user&&state.user.email)||"").toLowerCase();
const rateOf=a=>{const b=RT[a.id]||[0,0],rv=REV[a.id]||[],r=myRate(a.id),extra=(r&&!rv.some(x=>x.byEmail===meEm()))?r.stars:0,n=b[1]+rv.length+(extra?1:0);return n?{avg:(b[0]*b[1]+rv.reduce((t,x)=>t+x.stars,0)+extra)/n,n}:null};
const revHtml=a=>{const l=(REV[a.id]||[]).filter(x=>x.text).sort((x,y)=>y.t-x.t);return l.length?`<details class="revs"><summary>Voir les commentaires (${l.length})</summary>${l.slice(0,10).map(x=>`<div class="rv"><b>${esc(x.byName||"Voisin")}</b> <span class="gold">${"★".repeat(x.stars)}</span><div>${esc(x.text)}</div></div>`).join("")}</details>`:""};
const starTxt=a=>{const r=rateOf(a);if(!r&&a.mine)return "";return r?` · <span class="rate"><span class="gold">★</span> ${r.avg.toFixed(1).replace(".",",")} (${r.n} avis)</span>`:" · Pas encore d'avis"};
const $=s=>document.querySelector(s),main=$("#main");
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){try{localStorage.setItem("cdm",JSON.stringify({user:state.user,mine:state.ads.filter(a=>a.mine),accounts:state.accounts},(k,v)=>k==="img"?undefined:v))}catch(e){}}
function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function remine(){const em=(state.user&&state.user.email||"").toLowerCase();state.ads.forEach(a=>{if(a.owner!==undefined)a.mine=!!em&&String(a.owner).toLowerCase()===em})}
function shrinkImg(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{let w=im.width,h=im.height;const r=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*r));h=Math.max(1,Math.round(h*r));const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",q))};im.src=fr.result};fr.readAsDataURL(file)})}
const okImg=d=>typeof d==="string"&&/^data:image\/(jpeg|png|webp);base64,/.test(d);
function showImg(src){const o=document.createElement("div");o.className="lb";o.innerHTML='<img alt="Photo">';o.firstChild.src=src;o.onclick=()=>o.remove();document.body.appendChild(o)}
function delAd(id,after){if(!confirm("Supprimer cette annonce pour tout le monde ?"))return;
  state.ads=state.ads.filter(x=>x.id!==id);save();
  if(window.cdmAds)window.cdmAds.remove(id).catch(()=>toast("Suppression en ligne impossible : vérifiez la connexion"));
  toast("Annonce supprimée");if(after)after()}
const meKey=()=>String(state.user&&(state.user.email||state.user.name)||"").toLowerCase();
const isReal=a=>!!(a&&a.owner&&String(a.owner).toLowerCase()!==meKey());
const convIdFor=a=>isReal(a)?a.id+"_"+meKey():a.id;
let msgKey="",msgUnsub=null;
function ensureMsgSub(){const k=state.user?meKey():"";if(k===msgKey)return;if(msgUnsub){msgUnsub();msgUnsub=null}msgKey="";if(!k||!window.cdmMsgs)return;msgKey=k;msgUnsub=window.cdmMsgs.subscribe(k,(l,init)=>window.cdmMsgIn(l,init))}
window.cdmMsgIn=function(list,init){
  const u=state.user;if(!u)return;const m=meKey();u.seen=u.seen||{};
  const by={};list.forEach(x=>{(by[x.cid]=by[x.cid]||[]).push(x)});
  const old={};(u.convs||[]).forEach(c=>{if(c.remote)old[c.id]=c});
  const keep=(u.convs||[]).filter(c=>!c.remote&&SHOW_DEMO),fresh=[];
  const nc=Object.keys(by).map(id=>{
    const arr=by[id].sort((a,b)=>a.t-b.t),last=arr[arr.length-1],first=arr[0];
    const pm=arr.filter(x=>x.from!==m).pop(),peer=first.from===m?first.to:first.from;
    const viewing=state.view==="chat"&&String(state.chatId)===id;
    if(viewing)u.seen[id]=Date.now();
    const ins=arr.filter(x=>x.from!==m),lastIn=ins[ins.length-1];
    const unread=!!lastIn&&lastIn.t>(u.seen[id]||0);
    const prevIn=old[id]?old[id].msgs.filter(x=>x.from==="them").length:0;
    const who=pm?pm.fromName:first.toName;
    if(!init&&ins.length>prevIn&&!viewing)fresh.push(who||"un voisin");
    return {id:isNaN(+id)?id:id,adId:last.adId,remote:true,peer,who:who||peer,title:last.adTitle,cat:last.adCat,msgs:arr.map(x=>({from:x.from===m?"me":"them",text:x.text||"",t:x.t,img:x.img||""})),unread,rating:old[id]&&old[id].rating}
  });
  u.convs=keep.concat(nc);save();badge();
  if(fresh.length&&u.notif!==false){toast("Nouveau message de "+fresh[0]);try{if("Notification" in window&&Notification.permission==="granted"&&document.hidden)new Notification("CoupDeMain",{body:"Nouveau message de "+fresh[0]})}catch(x){}}
  if(state.view==="chat"&&state.drawChat&&document.getElementById("ms"))state.drawChat();
  else if(state.view==="inbox")inbox();
};
function go(v){state.view=v;remine();ensureMsgSub();ensureHome();render();window.scrollTo(0,0)}
function render(){
  setMe();
  if(!state.user&&!["welcome","profile"].includes(state.view))state.view="welcome";
  document.body.classList.toggle("gate",!state.user);
  document.querySelectorAll(".tab").forEach(b=>b.toggleAttribute("aria-current",b.dataset.v===state.view)||0);
  document.querySelectorAll(".tab").forEach(b=>b.dataset.v===(state.view==="chat"?"inbox":state.view)?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  ({home,find,offer,profile,photo,edit,delAcc,welcome,inbox,chat}[state.view])();

  const today=new Date().toISOString().slice(0,10),v=k=>esc(u[k]||"");
  main.innerHTML=`<h2 class="t">Modifier mes informations</h2>
  <form class="card" id="f" novalidate>
  <label for="pn">Prénom</label><input id="pn" autocomplete="given-name" maxlength="30" value="${v("name")}">
  <label for="nm">Nom</label><input id="nm" autocomplete="family-name" maxlength="30" value="${v("lastName")}">
  <label for="bd">Date de naissance</label><input id="bd" type="date" autocomplete="bday" max="${today}" value="${v("birth")}">
  <label for="ad">Adresse</label><input id="ad" autocomplete="street-address" maxlength="80" value="${v("address")}">
  <label for="cp">Code postal</label><input id="cp" inputmode="numeric" autocomplete="postal-code" maxlength="5" value="${v("cp")}">
  <label for="vl">Ville</label><input id="vl" autocomplete="address-level2" maxlength="40" value="${esc(ucity(u))}">
  <label for="tel">Numéro de téléphone</label><input id="tel" type="tel" autocomplete="tel" maxlength="20" value="${v("phone")}">
  <label for="m">E-mail</label><input id="m" type="email" autocomplete="email" value="${v("email")}">
  <div class="err" id="e" role="alert"></div><button class="btn solid" type="submit" style="width:100%">Enregistrer les modifications</button></form>
  <h2 class="t">Mot de passe</h2>
  <form class="card" id="g" novalidate>${u.pw?`<label for="op">Mot de passe actuel</label><input id="op" type="password" autocomplete="current-password">`:`<p class="meta">Ce compte n'a pas encore de mot de passe. Choisissez-en un.</p>`}
  <label for="np">Nouveau mot de passe</label><input id="np" type="password" autocomplete="new-password" placeholder="8 caractères minimum">
  <label for="cf">Confirmer le nouveau mot de passe</label><input id="cf" type="password" autocomplete="new-password">
  <div class="err" id="e2" role="alert"></div><button class="btn solid" type="submit" style="width:100%">Changer le mot de passe</button></form>
  <button class="chip" id="back" type="button">Retour au profil</button>`;
  const err=t=>{$("#e").textContent=t},e2=t=>{$("#e2").textContent=t};
  $("#back").onclick=()=>go("profile");
  attachSuggest($("#vl"));
  $("#f").onsubmit=async ev=>{ev.preventDefault();
    const [pn,nm,bd,ad,cp,tel,mm,vl0]=["pn","nm","bd","ad","cp","tel","m","vl"].map(i=>$("#"+i).value.trim()),m=mm.toLowerCase();
    const er=vInfo(pn,nm,bd,ad,cp,tel,m);if(er)return err(er);
    if(vl0.length<2)return err("Indiquez votre ville.");
    const vl=(await resolveCity(vl0,cp))||vl0;
    if(state.accounts.some(x=>x!==u&&x.email===m))return err("Un autre compte utilise déjà cet e-mail.");
    Object.assign(u,{name:pn,lastName:nm,birth:bd,address:ad,cp:cp,phone:tel,email:m,city:vl,area:vl});
    state.ads.forEach(a=>{if(a.mine){a.who=pn;a.area=vl;a.city=vl}});
    save();toast("Informations enregistrées");go("profile")};
  $("#g").onsubmit=async ev=>{ev.preventDefault();
    const np=$("#np").value,cf=$("#cf").value;
    try{if(u.pw){const op=$("#op").value;if(!op)return e2("Saisissez votre mot de passe actuel.");if(!await chk(u,op))return e2("Le mot de passe actuel est incorrect.")}
      if(np.length<8)return e2("Le nouveau mot de passe comporte 8 caractères minimum.");
      if(np!==cf)return e2("Les deux mots de passe ne sont pas identiques.");
      u.pw=await mkpw(np);save();toast("Mot de passe modifié");go("profile")}
    catch(x){e2("Impossible de modifier le mot de passe sur cet appareil.")}};
}
function delAcc(){
  const u=state.user;if(!u)return go("profile");
  main.innerHTML=`<h2 class="t">Supprimer mon compte</h2>
  <form class="card" id="f" novalidate><p>Cette action est définitive. Votre profil et votre photo seront effacés de cet appareil, et vos annonces seront retirées du site.</p>
  ${u.pw?`<label for="op">Mot de passe</label><input id="op" type="password" autocomplete="current-password">`:`<label for="cf">Tapez SUPPRIMER pour confirmer</label><input id="cf" autocomplete="off">`}
  <div class="err" id="e" role="alert"></div>
  <button class="btn" type="submit" style="width:100%;background:var(--err);color:#fff">Supprimer définitivement</button></form>
  <button class="chip" id="back" type="button">Annuler</button>`;
  $("#back").onclick=()=>go("profile");
  $("#f").onsubmit=async ev=>{ev.preventDefault();const err=t=>{$("#e").textContent=t};
    try{if(u.pw){const p=$("#op").value;if(!p)return err("Saisissez votre mot de passe.");if(!await chk(u,p))return err("Le mot de passe est incorrect.")}
      else if($("#cf").value.trim().toUpperCase()!=="SUPPRIMER")return err("Tapez SUPPRIMER pour confirmer.")}
    catch(x){return err("Impossible de vérifier le mot de passe sur cet appareil.")}
    if(window.cdmAds)window.cdmAds.removeMine(u.email);state.accounts=state.accounts.filter(a=>a!==u);state.ads=state.ads.filter(a=>!a.mine);state.user=null;state.sent=[];state.authMode="login";save();
    state.center=null;toast("Votre compte a été supprimé");go("welcome")};
}
const REPLIES=["Bonjour ! Oui, je suis disponible. Quel jour vous arrangerait ?","Très bien, ça me convient. On se met d'accord sur le tarif sur place ?","Parfait, à bientôt !"];
const hh=t=>new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
function badge(){const u=state.user,b=$("#nbd");if(b)b.hidden=!(u&&u.notif!==false&&(u.convs||[]).filter(vis).some(c=>c.unread))}
function inbox(){
  const u=state.user,cs=(u.convs||[]).filter(vis).sort((a,b)=>b.msgs[b.msgs.length-1].t-a.msgs[a.msgs.length-1].t);
  main.innerHTML=`<h2 class="t">Messages</h2>${cs.length?cs.map(c=>{const l=c.msgs[c.msgs.length-1];return `<button class="card item rc" data-id="${c.id}" style="width:100%;text-align:left;color:inherit"><div class="av" aria-hidden="true">${EMO[c.cat]}</div><div><h3>${esc(c.who)}${c.unread?' <span class="price">Nouveau</span>':""}</h3><div class="meta">${esc(c.title)}</div><div class="meta">${esc((l.from==="me"?"Vous : ":"")+(l.img&&!l.text?"📷 Photo":l.text).slice(0,60))}</div></div></button>`}).join(""):`<p class="empty">Aucune conversation pour le moment. Touchez « Contacter » sur une annonce pour écrire à un voisin.</p><button class="btn solid" id="gf" style="width:100%">Trouver de l'aide</button>`}`;
  main.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{const v=b.dataset.id;state.chatId=/^\d+$/.test(v)?+v:v;go("chat")});
  const g=$("#gf");if(g)g.onclick=()=>go("find");
}
function chat(){
  const u=state.user,cid=state.chatId,ad=state.ads.find(a=>a.id===parseInt(cid,10));
  u.convs=u.convs||[];let c=u.convs.find(x=>x.id===cid);
  if(!ad&&!c)return go("inbox");
  const real=!!(c&&c.remote)||!!(ad&&isReal(ad));
  const who=c?c.who:ad.who,title=c?c.title:ad.title,cat=c?c.cat:ad.cat,price=ad?ad.price:"";
  if(c&&c.unread)c.unread=false;if(c&&c.remote){u.seen=u.seen||{};u.seen[cid]=Date.now()}save();badge();
  const cur=()=>u.convs.find(x=>x.id===cid)||c;
  const draw=()=>{const cc0=cur(),ms=cc0?cc0.msgs:[],el=$("#ms");if(!el)return;el.innerHTML=ms.length?ms.map(m=>`<div class="bub ${m.from==="me"?"mine":"them"}">${okImg(m.img)?'<img class="mimg" src="'+m.img+'" alt="Photo envoyée">':""}${esc(m.text)}<small>${hh(m.t)}</small></div>`).join(""):`<p class="empty">Présentez-vous et proposez un jour pour le rendez-vous.</p>`;el.querySelectorAll(".mimg").forEach(i=>i.onclick=()=>showImg(i.src));el.scrollTop=el.scrollHeight};
  main.innerHTML=`<div class="chat"><div class="item" style="align-items:center;margin-bottom:8px"><button class="chip" id="bk" type="button" aria-label="Retour aux messages">←</button><div class="av" aria-hidden="true">${EMO[cat]}</div><div><h3>${esc(who)}</h3><div class="meta">${esc(title)}${price?" · "+esc(price):""}${ad?starTxt(ad):""}</div></div><button class="chip" id="rt" type="button" style="margin-left:auto">${c&&c.rating?"Modifier ma note":"Noter"}</button></div>
  <div id="rp" class="card" hidden></div>
  <div id="ms" class="ms" aria-live="polite"></div>
  <form id="mf" class="mf"><label for="mt" class="sr">Votre message</label><button class="chip" type="button" id="pb" aria-label="Envoyer une photo">📷</button><input type="file" id="pf" accept="image/*" hidden><input id="mt" maxlength="300" autocomplete="off" placeholder="Écrire un message" value="${c?"":esc("Bonjour "+who+", votre annonce « "+title+" » m'intéresse. Êtes-vous disponible cette semaine ?")}"><button class="btn solid" type="submit">Envoyer</button></form>
  <p class="note">${real?"Messagerie en direct : votre correspondant reçoit vos messages et vous répond ici. ":"Prototype : les réponses sont simulées. "}Le paiement se fait sur place : ne partagez jamais vos coordonnées bancaires.</p></div>`;
  draw();state.drawChat=draw;
  $("#bk").onclick=()=>{state.drawChat=null;go("inbox")};
  let stars=c&&c.rating?c.rating.stars:0,txt=c&&c.rating?c.rating.text:"";
  const panel=()=>{$("#rp").innerHTML=`<h3>Votre avis sur ${esc(who)}</h3><div class="stars" role="group" aria-label="Note sur 5">${[1,2,3,4,5].map(i=>`<button type="button" class="star${i<=stars?" on":""}" data-s="${i}" aria-label="${i} étoile${i>1?"s":""}" aria-pressed="${i<=stars}">★</button>`).join("")}</div>
  <label for="rc" class="sr">Commentaire</label><textarea id="rc" rows="2" maxlength="200" placeholder="Un commentaire (facultatif)">${esc(txt)}</textarea>
  <div class="err" id="re" role="alert"></div><button class="btn solid" id="rs" type="button" style="width:100%">Publier mon avis</button>`;
    $("#rp").querySelectorAll(".star").forEach(b=>b.onclick=()=>{txt=$("#rc").value;stars=+b.dataset.s;panel()});
    $("#rs").onclick=()=>{if(!stars){$("#re").textContent="Choisissez une note de 1 à 5 étoiles.";return}cur().rating={stars,text:$("#rc").value.trim()};save();const cc=cur();if(window.cdmReviews&&u.email){const em=u.email.toLowerCase();window.cdmReviews.publish({adId:String(cc.adId||cc.id),stars,text:cc.rating.text,byEmail:em,byName:u.name||"Voisin",t:Date.now()}).catch(()=>toast("Avis enregistré sur votre appareil seulement"))}toast("Merci pour votre avis !");chat()}};
  $("#rt").onclick=()=>{if(!cur()){toast("Envoyez d'abord un message pour pouvoir noter.");return}const r=$("#rp");r.hidden=!r.hidden;if(!r.hidden)panel()};
  $("#pb").onclick=()=>{if(!real){toast("Les photos sont disponibles dans les vraies conversations");return}$("#pf").click()};
  $("#pf").onchange=async ev=>{const f=ev.target.files[0];ev.target.value="";if(!f)return;
    if(!window.cdmMsgs){toast("Messagerie indisponible pour le moment");return}
    toast("Envoi de la photo…");
    try{let d=await shrinkImg(f,900,.72);if(d.length>700000)d=await shrinkImg(f,640,.6);if(d.length>900000){toast("Photo trop lourde, choisissez-en une autre");return}
      const cc=cur(),peer=cc&&cc.peer?cc.peer:String(ad.owner).toLowerCase();
      await window.cdmMsgs.send({cid:String(cid),adId:ad?ad.id:(cc||c).adId,adTitle:title,adCat:cat,from:meKey(),fromName:u.name||"",to:peer,toName:who||"",text:"",img:d,t:Date.now()})}
    catch(x){toast("Photo non envoyée : vérifiez la connexion")}};
  $("#mf").onsubmit=e=>{e.preventDefault();const t=$("#mt").value.trim();if(!t)return;
    if(real){const peer=c&&c.peer?c.peer:String(ad.owner).toLowerCase();
      if(!window.cdmMsgs){toast("Messagerie indisponible pour le moment");return}
      $("#mt").value="";
      window.cdmMsgs.send({cid:String(cid),adId:ad?ad.id:c.adId,adTitle:title,adCat:cat,from:meKey(),fromName:u.name||"",to:peer,toName:who||"",text:t,t:Date.now()}).catch(()=>toast("Message non envoyé : vérifiez la connexion et les règles Firestore"));
      return}
    if(!c){c={id:state.chatId,who,title,cat,msgs:[],unread:false};u.convs.push(c)}
    c.msgs.push({from:"me",text:t,t:Date.now()});$("#mt").value="";save();draw();
    const n=c.msgs.filter(m=>m.from==="me").length,cc=c;
    setTimeout(()=>{if(state.user!==u)return;cc.msgs.push({from:"them",text:REPLIES[Math.min(n,REPLIES.length)-1],t:Date.now()});
      if(state.view==="chat"&&state.chatId===cc.id){draw()}else{cc.unread=true;if(u.notif!==false){toast("Nouveau message de "+cc.who);try{if("Notification" in window&&Notification.permission==="granted"&&document.hidden)new Notification("CoupDeMain",{body:"Nouveau message de "+cc.who})}catch(x){}}}save();badge()},1200)};
}
const ME0=$("#me").innerHTML;
function setMe(){const u=state.user;$("#me").innerHTML=u&&u.photo?'<img src="'+u.photo+'" alt="">':ME0}
function av(u){return '<div class="av">'+(u.photo?'<img src="'+u.photo+'" alt="">':esc((u.name||"?")[0].toUpperCase()))+'</div>'}
function photo(){
  const u=state.user;if(!u)return go("profile");
  let data=u.photo||"";
  main.innerHTML=`<h2 class="t">Votre photo de profil</h2>
  <div class="card" style="text-align:center"><div class="ph" id="pv"></div>
  <p class="meta">Une photo aide vos voisins à vous faire confiance. Choisissez un visage net et bien éclairé.</p>
  <input id="fi" type="file" accept="image/*" hidden>
  <button class="btn solid" id="pick" type="button" style="width:100%">Choisir une photo</button>
  <div class="err" id="e" role="alert"></div>
  <button class="btn gold" id="ok" type="button" style="width:100%">Enregistrer et continuer</button>
  <button class="chip" id="skip" type="button" style="margin-top:12px">Passer pour l'instant</button></div>`;
  const err=t=>{$("#e").textContent=t};
  const show=()=>{$("#pv").innerHTML=data?'<img src="'+data+'" alt="Aperçu de votre photo">':esc((u.name||"?")[0].toUpperCase())};
  show();
  $("#pick").onclick=()=>$("#fi").click();
  $("#fi").onchange=ev=>{const f=ev.target.files[0];if(!f)return;
    if(!f.type.startsWith("image/"))return err("Choisissez un fichier image.");
    const r=new FileReader();r.onerror=()=>err("Ce fichier n'a pas pu être lu. Essayez-en un autre.");
    r.onload=()=>{const im=new Image();im.onerror=()=>err("Cette image n'a pas pu être lue. Essayez-en une autre.");
      im.onload=()=>{const s=256,c=document.createElement("canvas");c.width=c.height=s;const m=Math.min(im.width,im.height);
        c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);data=c.toDataURL("image/jpeg",.82);show();err("")};
      im.src=r.result};r.readAsDataURL(f)};
  $("#ok").onclick=()=>{if(!data)return err("Choisissez d'abord une photo, ou passez cette étape.");u.photo=data;save();toast("Photo enregistrée");go("home")};
  $("#skip").onclick=()=>go("home");
}
function welcome(){
  main.innerHTML=`<section class="hero"><h2>Un voisin peut faire toute la différence.</h2>
  <p>Trouvez un coup de main près de chez vous, ou partagez vos compétences.</p>
  <div class="row2"><button class="btn" id="su">Créer mon compte</button><button class="btn ghost" id="li">Se connecter</button></div></section>
  <div class="card" style="margin-top:16px"><h3>Comment ça marche ?</h3><ol class="steps"><li>Créez votre profil.</li><li>Trouvez ou proposez un service.</li><li>Convenez du rendez-vous et du tarif.</li><li>Le paiement se fait sur place, entre vous.</li></ol></div>
  <p class="note">Prototype : profils et annonces fictifs</p>`;
  $("#su").onclick=()=>{state.authMode="signup";go("profile")};
  $("#li").onclick=()=>{state.authMode="login";go("profile")};
}
if(!state.user)state.view="welcome";

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,query,where,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp(firebaseConfig),db=getFirestore(app);
let auth=null,unsub=null;
/* ====== ANNONCES PARTAGÉES (Firestore, collection "ads") ====== */
window.cdmAds={
  publish:ad=>setDoc(doc(db,"ads",String(ad.id)),{id:ad.id,cat:ad.cat,title:ad.title,desc:ad.desc,price:ad.price,who:ad.who,area:ad.area||"",city:ad.city||"",loc:ad.loc||"",lat:ad.lat==null?null:ad.lat,lon:ad.lon==null?null:ad.lon,owner:(ad.owner||"").toLowerCase(),created:Date.now()}),
  subscribe:cb=>{if(unsub)unsub();unsub=onSnapshot(collection(db,"ads"),snap=>{window.cdmRemoteOk=true;cb(snap.docs.map(d=>d.data()).filter(a=>a&&a.id))},()=>{window.cdmRemoteOk=false})},
  remove:id=>deleteDoc(doc(db,"ads",String(id))),
  removeMine:async email=>{try{const q=await getDocs(query(collection(db,"ads"),where("owner","==",String(email||"").toLowerCase())));await Promise.all(q.docs.map(d=>deleteDoc(d.ref)))}catch(e){}}
};
window.cdmReviews={
  publish:r=>setDoc(doc(db,"reviews",r.adId+"_"+r.byEmail.replace(/[^a-z0-9]/g,"_")),r),
  subscribe:cb=>onSnapshot(collection(db,"reviews"),s=>cb(s.docs.map(d=>d.data()).filter(r=>r&&r.adId)),()=>{})
};
window.cdmMsgs={
  send:m=>setDoc(doc(db,"msgs",m.t+"_"+Math.random().toString(36).slice(2,8)),m),
  subscribe:(me,cb)=>{const A=new Map(),B=new Map();let loaded=0;
    const mk=(f,M)=>onSnapshot(query(collection(db,"msgs"),where(f,"==",me)),s=>{const init=loaded<2;if(init)loaded++;M.clear();s.docs.forEach(d=>M.set(d.id,d.data()));cb([...new Map([...A,...B]).values()],init)},()=>{});
    const u1=mk("to",A),u2=mk("from",B);return()=>{u1();u2()}}
};
window.dispatchEvent(new Event("cdm-ready"));
window.cdmGoogle=async()=>{
  if(!firebaseConfig.apiKey)throw {code:"cdm/not-configured"};
  if(!auth)auth=getAuth(app);
  const r=await signInWithPopup(auth,new GoogleAuthProvider());
  return {email:r.user.email,name:r.user.displayName||"",photo:r.user.photoURL||""};
};
