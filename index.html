<title>CoupDeMain – L'entraide près de chez vous</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f6f7f6;--card:#fff;--ink:#111513;--mute:#5b655f;--g1:#0a2a20;--g2:#178a42;--btn:#2ac45e;--mint:#eceeed;--on-btn:#04140a;--gold:#f2b33d;--line:#e2e5e3;--err:#b3261e;--sh:0 1px 2px rgba(14,59,46,.05);--float:0 14px 32px -14px rgba(14,59,46,.4);--r:18px;--disp:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e100f;--card:#171a18;--ink:#eef1ef;--mute:#a0aaa4;--btn:#2ac45e;--mint:#222624;--line:#2a2e2c;--sh:none;--float:0 14px 32px -14px rgba(0,0,0,.8);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{zoom:.9;margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 120px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;margin:0 -16px 20px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.logo{flex:none;width:38px;height:38px;display:block}.logo svg{display:block;width:100%;height:100%}
header h1{font:800 19px/1.1 var(--disp);letter-spacing:-.02em;margin:0}
header small{color:var(--mute);font-size:12.5px}
.me{margin-left:auto;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0;overflow:hidden;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.me img,.av img{width:100%;height:100%;object-fit:cover;display:block}
button,.btn{font:inherit;cursor:pointer}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:700;background:var(--mint);color:var(--ink);min-height:48px;transition:transform .12s}

window.cdmUsers={
  get:async uid=>{const d=await getDoc(doc(db,"users",uid));return d.exists()?d.data():null},
  set:(uid,data)=>setDoc(doc(db,"users",uid),data),
  remove:uid=>deleteDoc(doc(db,"users",uid))
};
/* ====== ANNONCES PARTAGÉES (collection "ads") ====== */
window.cdmAds={
  publish:ad=>setDoc(doc(db,"ads",String(ad.id)),{id:ad.id,cat:ad.cat,title:ad.title,desc:ad.desc,price:ad.price,who:ad.who,area:ad.area||"",city:ad.city||"",loc:ad.loc||"",lat:ad.lat==null?null:ad.lat,lon:ad.lon==null?null:ad.lon,owner:String(ad.owner||""),type:ad.type==="need"?"need":"offer",rec:ad.rec||"",img:ad.img||"",created:Date.now()}),
  subscribe:cb=>{if(unsubAds)unsubAds();unsubAds=onSnapshot(collection(db,"ads"),snap=>{window.cdmRemoteOk=true;cb(snap.docs.map(d=>Object.assign(d.data(),{id:+d.id})).filter(a=>a&&Number.isFinite(a.id)))},()=>{window.cdmRemoteOk=false})},
  remove:id=>deleteDoc(doc(db,"ads",String(id))),
  removeMine:async uid=>{const q=await getDocs(query(collection(db,"ads"),where("owner","==",String(uid||""))));await Promise.all(q.docs.map(d=>deleteDoc(d.ref)))}
};
window.cdmReviews={
  publish:r=>setDoc(doc(db,"reviews",r.adId+"_"+r.byUid),r),
  subscribe:cb=>{if(unsubRev)unsubRev();unsubRev=onSnapshot(collection(db,"reviews"),s=>cb(s.docs.map(d=>d.data()).filter(r=>r&&r.adId)),()=>{})},
  removeMine:async uid=>{const q=await getDocs(query(collection(db,"reviews"),where("byUid","==",String(uid||""))));await Promise.all(q.docs.map(d=>deleteDoc(d.ref)))}
};
window.cdmReports={
  publish:r=>setDoc(doc(db,"reports",r.adId+"_"+Date.now()),r)
};
window.cdmMsgs={
  send:m=>setDoc(doc(db,"msgs",m.t+"_"+Math.random().toString(36).slice(2,8)),m),
  subscribe:(me,cb)=>{const A=new Map(),B=new Map();let loaded=0;
    const mk=(f,M)=>onSnapshot(query(collection(db,"msgs"),where(f,"==",me)),s=>{const init=loaded<2;if(init)loaded++;M.clear();s.docs.forEach(d=>M.set(d.id,d.data()));cb([...new Map([...A,...B]).values()],init)},()=>{});
    const u1=mk("to",A),u2=mk("from",B);return()=>{u1();u2()}},
  removeMine:async uid=>{const q=await getDocs(query(collection(db,"msgs"),where("from","==",String(uid||""))));await Promise.all(q.docs.map(d=>deleteDoc(d.ref)))}
};
window.dispatchEvent(new Event("cdm-ready"));
</script>
</body>
